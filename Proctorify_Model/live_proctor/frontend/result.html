<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proctorify | Exam Result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<style>
    .result-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 60px 24px;
        text-align: center;
    }

    .success-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        background: rgba(61, 220, 151, 0.1);
        border: 2px solid var(--ok);
        color: var(--ok);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 800;
    }

    .badge {
        display: inline-block;
        background: rgba(91, 140, 255, 0.1);
        color: var(--accent);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 16px;
    }

    .result-container h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
    }

    .result-container .message {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 32px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 32px;
    }

    .stat-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px 12px;
    }

    .stat-label {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted-2);
        margin-bottom: 8px;
    }

    .stat-value {
        font-size: 22px;
        font-weight: 700;
    }

    .stat-value.warning {
        color: var(--warn);
    }
    .stat-value.danger {
        color: var(--danger);
    }
    .stat-value.ok {
        color: var(--ok);
    }

    .info-box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 24px;
        text-align: left;
    }

    .info-box-label {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted-2);
        margin-bottom: 6px;
    }

    .info-box-value {
        font-size: 13px;
        font-family: var(--mono);
    }

    .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
    }

    .loading-state {
        text-align: center;
        padding: 100px 20px;
        color: var(--muted);
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-brand">
        <div class="brand-mark"></div>
        <div class="brand-name">Proctor<span>ify</span></div>
    </div>
    <div class="topbar-right">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>
</div>

<div id="resultContent" class="result-container">
    <div class="loading-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 16px; opacity: 0.5;">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 6v6l4 2"></path>
        </svg>
        <div>Loading your result...</div>
    </div>
</div>

<script src="/static/auth.js"></script>
<script>
    initTheme();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    // Require authentication
    requireAuth().then(user => {
        if (!user) return;
        loadResult();
    });

    async function loadResult() {
        const sessionId = sessionStorage.getItem('result_session_id');
        if (!sessionId) {
            document.getElementById('resultContent').innerHTML = `
                <div class="empty-state" style="padding: 100px;">
                    <div>No session to display.</div>
                    <button class="btn-secondary" style="margin-top: 20px;" onclick="window.location.href='/lobby'">Back to Lobby</button>
                </div>
            `;
            return;
        }
        sessionStorage.removeItem('result_session_id');

        try {
            const data = await apiCall(`/api/session/${sessionId}/summary`);
            renderResult(data);
        } catch (err) {
            document.getElementById('resultContent').innerHTML = `
                <div class="empty-state" style="padding: 100px;">
                    <div style="color: var(--danger);">Failed to load result: ${escapeHtml(err.message)}</div>
                    <button class="btn-secondary" style="margin-top: 20px;" onclick="window.location.href='/lobby'">Back to Lobby</button>
                </div>
            `;
        }
    }

    function renderResult(data) {
        // Determine integrity status based on flag percentage
        let integrityClass = 'ok';
        let integrityLabel = 'Clean';
        if (data.flag_percentage > 30) {
            integrityClass = 'danger';
            integrityLabel = 'Serious Concerns';
        } else if (data.flag_percentage > 10) {
            integrityClass = 'warning';
            integrityLabel = 'Some Flags';
        }

        const startTime = data.started_at ? new Date(data.started_at).toLocaleString() : 'N/A';
        const endTime = data.ended_at ? new Date(data.ended_at).toLocaleString() : 'N/A';

        document.getElementById('resultContent').innerHTML = `
            <div class="success-icon">✓</div>
            <div class="badge">EXAMINATION COMPLETED</div>
            <h1>Your Exam Has Been Submitted</h1>
            <p class="message">
                Your answers have been recorded.<br>
                Thank you for completing the examination.
            </p>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Exam</div>
                    <div class="stat-value" style="font-size: 14px;">${escapeHtml(data.exam_title || 'N/A')}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Questions Answered</div>
                    <div class="stat-value">${data.answered_count}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value ok">${escapeHtml(data.status || 'completed')}</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Frames Analyzed</div>
                    <div class="stat-value">${data.total_frames.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Alerts Fired</div>
                    <div class="stat-value ${data.alert_count > 0 ? 'warning' : 'ok'}">${data.alert_count}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Flag %</div>
                    <div class="stat-value ${integrityClass}">${data.flag_percentage.toFixed(1)}%</div>
                </div>
            </div>

            <div class="info-box">
                <div class="info-box-label">Session Integrity</div>
                <div class="info-box-value">${integrityLabel}</div>
            </div>

            <div class="info-box">
                <div class="info-box-label">Started</div>
                <div class="info-box-value">${startTime}</div>
            </div>

            <div class="info-box">
                <div class="info-box-label">Submitted</div>
                <div class="info-box-value">${endTime}</div>
            </div>

            <div class="actions">
                <button class="btn-secondary" onclick="window.location.href='/lobby'">Back to Lobby</button>
                <button class="btn-primary" onclick="logout()">Logout</button>
            </div>
        `;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
