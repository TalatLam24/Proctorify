<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proctorify | Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="page-container">
    <div class="auth-card">
        <!-- Brand -->
        <div class="brand" style="margin-bottom: 32px;">
            <div class="brand-mark"></div>
            <div class="brand-name">Proctor<span>ify</span></div>
            <button class="theme-toggle" id="themeToggle" style="margin-left: auto;" aria-label="Toggle theme" title="Toggle theme">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>

        <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">Create account</h1>
        <p class="muted" style="font-size: 14px; margin-bottom: 28px;">Register to take proctored exams.</p>

        <div id="errorMsg" class="error-msg" style="display: none;"></div>

        <form id="registerForm">
            <div style="margin-bottom: 16px;">
                <label class="input-label" for="name">Full Name</label>
                <input type="text" id="name" class="input-field" placeholder="Your name" required>
            </div>

            <div style="margin-bottom: 16px;">
                <label class="input-label" for="email">Email</label>
                <input type="email" id="email" class="input-field" placeholder="you@example.com" required>
            </div>

            <div style="margin-bottom: 20px;">
                <label class="input-label" for="password">Password</label>
                <input type="password" id="password" class="input-field" placeholder="At least 6 characters" required minlength="6">
            </div>

            <button type="submit" class="btn-primary" id="registerBtn" style="width: 100%; margin-bottom: 16px;">
                Create Account
            </button>
        </form>

        <p class="muted" style="text-align: center; font-size: 13px;">
            Already have an account? <a class="link" href="/">Sign In</a>
        </p>

        <div class="footer-text">© 2026 Proctorify</div>
    </div>
</div>

<script src="/static/auth.js"></script>
<script>
    initTheme();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    // Redirect to lobby if already logged in
    redirectIfAuth();

    const form = document.getElementById('registerForm');
    const errorMsg = document.getElementById('errorMsg');
    const registerBtn = document.getElementById('registerBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!name || !email || !password) {
            errorMsg.textContent = 'All fields are required.';
            errorMsg.style.display = 'block';
            return;
        }

        if (password.length < 6) {
            errorMsg.textContent = 'Password must be at least 6 characters.';
            errorMsg.style.display = 'block';
            return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = 'Creating account...';

        try {
            const data = await apiCall('/api/register', {
                method: 'POST',
                body: JSON.stringify({ name, email, password })
            });
            setToken(data.token, { name: data.name });
            window.location.href = '/lobby';
        } catch (err) {
            errorMsg.textContent = err.message || 'Registration failed. Please try again.';
            errorMsg.style.display = 'block';
            registerBtn.disabled = false;
            registerBtn.textContent = 'Create Account';
        }
    });
</script>

</body>
</html>
